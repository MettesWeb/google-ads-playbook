<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Support & Affiliate Quiz</title>
  <style>
:root{
  --primary-blue:#0f5132;
  --secondary-blue:#16834f;
  --gold:#c8a84e;
  --light-bg:#f4fbf7;
  --card-bg:#ffffff;
  --border-color:#dbeee2;
  --text-dark:#123326;
  --text-muted:#5f7569;
  --correct-bg:#d1fae5;
  --correct-border:#10b981;
  --incorrect-bg:#fee2e2;
  --incorrect-border:#ef4444;
  --shadow-md:0 12px 30px rgba(15,81,50,.12);
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--light-bg);
  color:var(--text-dark);
  min-height:100vh;
  margin:0;
}
.quiz-header{
  background:var(--primary-blue);
  color:#fff;
  border-bottom:4px solid var(--gold);
  padding:1.15rem 1.5rem;
  box-shadow:0 8px 24px rgba(15,81,50,.13);
}
.quiz-header-inner{
  width:min(1200px,calc(100% - 2rem));
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
}
.quiz-header h1{
  font-size:clamp(2rem,3.8vw,2.8rem);
  line-height:1.08;
  margin:0;
  font-weight:850;
  letter-spacing:-.02em;
  color:#fff;
  text-align:left;
}
.back-link-header{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.28);
  padding:.82rem 1rem;
  border-radius:9px;
  font-weight:800;
  white-space:nowrap;
}
.back-link-header:hover{background:rgba(255,255,255,.18)}
.quiz-main{
  min-height:calc(100vh - 98px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:3rem 1.25rem;
}
.quiz-container{
  background-color:#fff;
  border-radius:12px;
  box-shadow:var(--shadow-md);
  width:100%;
  max-width:850px;
  padding:40px;
}
.progress{
  text-align:center;
  color:var(--text-muted);
  font-size:15px;
  margin-bottom:30px;
  font-weight:700;
}
.question{
  font-size:20px;
  font-weight:750;
  margin-bottom:25px;
  line-height:1.5;
  color:var(--text-dark);
}
.options{display:flex;flex-direction:column;gap:12px}
.option{
  background-color:#f8fffb;
  border:2px solid var(--border-color);
  border-radius:8px;
  padding:16px;
  font-size:16px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  font-weight:500;
  color:#416552;
  line-height:1.45;
}
.option:hover:not(:disabled){background-color:#e8f8ee;border-color:#bfe4ca}
.option.correct{background-color:var(--correct-bg)!important;border-color:var(--correct-border)!important;color:#065f46!important;font-weight:700}
.option.incorrect{background-color:var(--incorrect-bg)!important;border-color:var(--incorrect-border)!important;color:#991b1b!important}
.option:disabled{cursor:default}
.feedback{
  margin-top:25px;
  font-size:16px;
  text-align:left;
  min-height:24px;
  padding:15px;
  border-radius:8px;
  display:none;
  line-height:1.5;
}
.feedback.success{background-color:var(--correct-bg);color:#065f46;border-left:5px solid var(--correct-border)}
.feedback.error{background-color:var(--incorrect-bg);color:#991b1b;border-left:5px solid var(--incorrect-border)}
.btn-container{display:flex;justify-content:flex-end;margin-top:30px}
.next-btn{
  background-color:var(--secondary-blue);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:14px 28px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:background-color .2s;
  display:none;
}
.next-btn:hover{background-color:var(--primary-blue)}
.result-container{text-align:center;display:none}
.result-container h2{color:var(--primary-blue);font-size:30px;margin-bottom:20px}
.result-container p{font-size:20px;color:#4a5568;margin-bottom:30px}
.score-circle{
  width:150px;
  height:150px;
  border-radius:50%;
  background:var(--primary-blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  font-weight:850;
  margin:0 auto 24px auto;
}
.restart-btn{background-color:var(--secondary-blue);color:white;border:none;border-radius:8px;padding:14px 28px;font-size:16px;font-weight:800;cursor:pointer}
.restart-btn:hover{background-color:var(--primary-blue)}
@media(max-width:760px){
  .quiz-header-inner{width:100%;flex-direction:column;align-items:stretch}
  .back-link-header{width:100%}
  .quiz-container{padding:28px 20px}
}
</style>
</head>
<body>
<header class="quiz-header">
  <div class="quiz-header-inner">
    <h1>Support & Affiliate Quiz</h1>
    <a class="back-link-header" href="spezi1.html">← Zur grünen Übersicht</a>
  </div>
</header>

<main class="quiz-main">
  <div class="quiz-container">
    <div id="quiz">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-container"><button class="next-btn" id="nextBtn">Weiter</button></div>
    </div>

    <div class="result-container" id="result">
      <div class="score-circle" id="scoreCircle">0</div>
      <h2>Quiz abgeschlossen</h2>
      <p id="scoreText"></p>
      <button class="restart-btn" onclick="restartQuiz()">Nochmal starten</button>
    </div>
  </div>
</main>

<script>
const questions = [
  {
    "q": "Warum ist Live Chat im E-Commerce besonders stark?",
    "options": [
      "Weil er nur nach dem Kauf eingesetzt wird",
      "Weil dort nie Datenschutz relevant ist",
      "Weil er Kund*innen im aktiven Prozess unterstützt, z. B. bei Checkout, Zahlung oder Paketproblem",
      "Weil lange Erklärungen besser funktionieren"
    ],
    "answer": 2,
    "explanation": "Live Chat hilft im Moment, in dem ein Problem den nächsten Schritt blockiert."
  },
  {
    "q": "Welche Schreibregel passt zum professionellen Chat-Stil?",
    "options": [
      "1 Message = 1 Zweck",
      "Viele Fachwörter nutzen",
      "Möglichst lange Absätze schreiben",
      "Keine nächsten Schritte nennen"
    ],
    "answer": 0,
    "explanation": "Im Chat müssen Nachrichten kurz, scanbar und zweckklar sein."
  },
  {
    "q": "Was bedeutet Chunking im Chat?",
    "options": [
      "Alle Informationen in einen langen Text schreiben",
      "Kundendaten öffentlich abfragen",
      "KI ohne Prüfung antworten lassen",
      "Informationen in kleine, gut lesbare Blöcke teilen"
    ],
    "answer": 3,
    "explanation": "Chunking reduziert Missverständnisse und macht Antworten schnell erfassbar."
  },
  {
    "q": "Welche Reihenfolge passt zum 5-Phasen-Flow im Live Chat?",
    "options": [
      "Abschluss → Zahlung → Anzeige → Retargeting → Newsletter",
      "Start & Rahmen → Anliegen klären → Wartezeit managen → Lösung führen → Abschluss",
      "Spam → Block → Löschen → Melden → Ignorieren",
      "Affiliate-Link → Cookie → Netzwerk → Sale → Auszahlung"
    ],
    "answer": 1,
    "explanation": "Der Chat-Flow führt vom Start bis zum sicheren Abschluss."
  },
  {
    "q": "Was ist bei Wartezeit im Chat wichtig?",
    "options": [
      "Immer Zeit + nächster Schritt nennen",
      "Stille wirkt professionell",
      "Keine Rückmeldung geben",
      "Sofort etwas versprechen"
    ],
    "answer": 0,
    "explanation": "Stille wirkt im Chat schnell wie Ignorieren."
  },
  {
    "q": "Was ist KI-Triage im Service?",
    "options": [
      "Automatisches Löschen aller Kommentare",
      "Auszahlung von Affiliate-Provision",
      "Sortieren, priorisieren und vorbereiten von Anfragen",
      "Ersetzen aller Mitarbeitenden"
    ],
    "answer": 2,
    "explanation": "KI-Triage hilft bei Intent, Dringlichkeit, Sprache und Routing."
  },
  {
    "q": "Was bedeutet Human-in-the-Loop im Support?",
    "options": [
      "KI darf alles blind senden",
      "Der Mensch prüft Fakten und Verantwortung bleibt beim Menschen",
      "Der Kunde löst alles allein",
      "Nur öffentliche Kommentare sind erlaubt"
    ],
    "answer": 1,
    "explanation": "KI zeigt Richtung, aber der Mensch prüft und entscheidet."
  },
  {
    "q": "Was ist die Grundregel im Social Media Support?",
    "options": [
      "Alle Kundendaten öffentlich klären",
      "Nie antworten",
      "Nur mit Emojis reagieren",
      "Public stabilisieren, privat lösen"
    ],
    "answer": 3,
    "explanation": "Öffentlich wird anerkannt und der nächste Schritt gesetzt; Daten gehören in DM."
  },
  {
    "q": "Welche Kommentarart gehört zur Kategorie E?",
    "options": [
      "Normale Servicefrage",
      "Hass, Drohung oder illegale Inhalte",
      "Respektvolle Beschwerde",
      "Produktfrage"
    ],
    "answer": 1,
    "explanation": "Kategorie E wird gelöscht, gemeldet oder blockiert."
  },
  {
    "q": "Was ist der Nutzen von Auto-Replies im Social Support?",
    "options": [
      "Sie bereiten vor und setzen Erwartungen, lösen aber nicht alles endgültig",
      "Sie ersetzen jede Fallprüfung",
      "Sie dürfen konkrete Zusagen ohne Fakten machen",
      "Sie machen Datenschutz überflüssig"
    ],
    "answer": 0,
    "explanation": "Auto-Replies sorgen für schnelle Orientierung, aber keine ungeprüften Zusagen."
  },
  {
    "q": "Was ist Affiliate Marketing?",
    "options": [
      "Eine reine Support-Methode",
      "Ein Designsystem für Landingpages",
      "Erfolgsbasierte Werbung mit Provision bei messbarer Aktion",
      "Ein kostenloser Newsletter ohne Tracking"
    ],
    "answer": 2,
    "explanation": "Provision entsteht nur bei Erfolg, etwa Verkauf oder Anmeldung."
  },
  {
    "q": "Wer ist der Merchant bzw. Advertiser?",
    "options": [
      "Der Kunde im Shop",
      "Der Cookie im Browser",
      "Die Kommentarmoderation",
      "Das Unternehmen, das Produkte verkauft und Provision zahlt"
    ],
    "answer": 3,
    "explanation": "Der Merchant betreibt das Partnerprogramm und zahlt Provision bei Erfolg."
  },
  {
    "q": "Was macht ein Affiliate bzw. Publisher?",
    "options": [
      "Er bewirbt Produkte und nutzt Affiliate-Links",
      "Er löscht öffentliche Beschwerden",
      "Er setzt immer die Cookie-Laufzeit fest",
      "Er ist automatisch das Netzwerk"
    ],
    "answer": 0,
    "explanation": "Affiliates bringen Traffic über Inhalte, Social Media, Blogs oder Videos."
  },
  {
    "q": "Was ist ein Affiliate-Netzwerk?",
    "options": [
      "Ein öffentlicher Kommentarbereich",
      "Eine Plattform, die Merchant und Affiliate verbindet und Tracking/Abrechnung unterstützt",
      "Ein Chatbot-Training",
      "Eine reine Bilddatenbank"
    ],
    "answer": 1,
    "explanation": "Netzwerke bündeln Programme, Tracking, Reporting und Auszahlungen."
  },
  {
    "q": "Was ist ein Affiliate-Link?",
    "options": [
      "Ein normaler Link ohne Tracking",
      "Ein Chat-Protokoll",
      "Ein Social-Media-Filter",
      "Ein spezieller Link mit Kennung zur Zuordnung der Vermittlung"
    ],
    "answer": 3,
    "explanation": "Ohne Affiliate-Link gibt es keine saubere Zuordnung."
  },
  {
    "q": "Was ist beim Affiliate-Tracking wichtig?",
    "options": [
      "Tracking ist für Provision egal",
      "Bestellnummern werden öffentlich gepostet",
      "Klick setzt bei Consent ein Cookie und speichert die Affiliate-ID",
      "Nur Likes werden gemessen"
    ],
    "answer": 2,
    "explanation": "Ohne Tracking keine Vergütung."
  },
  {
    "q": "Was bedeutet Cookie-Laufzeit?",
    "options": [
      "Zeit bis ein Chatbot antwortet",
      "Zeitraum, in dem ein Verkauf dem Affiliate zugeordnet werden kann",
      "Dauer einer Social-Media-Kampagne",
      "Anzahl der Kommentare"
    ],
    "answer": 1,
    "explanation": "Die Cookie-Laufzeit bestimmt den Zeitraum des Affiliate-Anspruchs."
  },
  {
    "q": "Welches Provisionsmodell vergütet einen abgeschlossenen Verkauf?",
    "options": [
      "Pay per Lead",
      "Pay per Click",
      "Auto-Reply",
      "Pay per Sale"
    ],
    "answer": 3,
    "explanation": "Pay per Sale bedeutet Provision pro Verkauf."
  },
  {
    "q": "Welche vier Säulen nennt das Affiliate-Playbook für Erfolg?",
    "options": [
      "Content, Traffic, Conversion, Optimierung",
      "Design, Farbe, Logo, Schrift",
      "Likes, Shares, Hashtags, Emojis",
      "Chat, DM, Troll, Block"
    ],
    "answer": 0,
    "explanation": "Erfolgreiche Affiliates brauchen hilfreichen Content, Besucher, Conversion und datenbasierte Optimierung."
  },
  {
    "q": "Was ist ein typisches Affiliate-Risiko?",
    "options": [
      "Zu klare Kennzeichnung",
      "Zu gute Nische",
      "Irreführende Empfehlungen, Click-Fraud oder schlechte Partnerqualität",
      "Zu sauberes Tracking"
    ],
    "answer": 2,
    "explanation": "Affiliate Marketing braucht klare Regeln, Transparenz und Qualitätssicherung."
  }
];

let currentQuestion=0, score=0, answered=false;
const progressEl=document.getElementById('progress');
const questionEl=document.getElementById('question');
const optionsEl=document.getElementById('options');
const feedbackEl=document.getElementById('feedback');
const nextBtn=document.getElementById('nextBtn');
const quizEl=document.getElementById('quiz');
const resultEl=document.getElementById('result');
const scoreTextEl=document.getElementById('scoreText');
const scoreCircleEl=document.getElementById('scoreCircle');

function loadQuestion(){
  answered=false;
  const q=questions[currentQuestion];
  progressEl.textContent=`Frage ${currentQuestion+1} von ${questions.length}`;
  questionEl.textContent=`${currentQuestion+1}. ${q.q}`;
  optionsEl.innerHTML='';
  feedbackEl.style.display='none';
  feedbackEl.className='feedback';
  nextBtn.style.display='none';
  q.options.forEach((option,index)=>{
    const button=document.createElement('button');
    button.className='option';
    button.textContent=`${String.fromCharCode(65+index)}) ${option}`;
    button.addEventListener('click',()=>selectOption(index,button));
    optionsEl.appendChild(button);
  });
}

function selectOption(index,button){
  if(answered)return;
  answered=true;
  const q=questions[currentQuestion];
  const optionButtons=document.querySelectorAll('.option');
  optionButtons.forEach(btn=>btn.disabled=true);
  optionButtons[q.answer].classList.add('correct');
  if(index===q.answer){
    score++;
    feedbackEl.textContent='Richtig. '+q.explanation;
    feedbackEl.classList.add('success');
  }else{
    button.classList.add('incorrect');
    feedbackEl.textContent='Nicht ganz. '+q.explanation;
    feedbackEl.classList.add('error');
  }
  feedbackEl.style.display='block';
  nextBtn.textContent=currentQuestion<questions.length-1?'Weiter':'Ergebnis anzeigen';
  nextBtn.style.display='inline-block';
}

nextBtn.addEventListener('click',()=>{
  currentQuestion++;
  if(currentQuestion<questions.length){loadQuestion();}else{showResult();}
});

function showResult(){
  quizEl.style.display='none';
  resultEl.style.display='block';
  scoreCircleEl.textContent=score;
  scoreTextEl.textContent=`Du hast ${score} von ${questions.length} Fragen richtig beantwortet.`;
}

function restartQuiz(){
  currentQuestion=0;
  score=0;
  quizEl.style.display='block';
  resultEl.style.display='none';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
