<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Ads Quiz</title>
  <style>
:root{
  --primary-blue:#0b1f38;
  --secondary-blue:#16365d;
  --gold:#c8a84e;
  --light-bg:#f0f4f8;
  --card-bg:#ffffff;
  --border-color:#d7e1ec;
  --text-dark:#0b1f38;
  --text-muted:#64748b;
  --correct-bg:#d1fae5;
  --correct-border:#10b981;
  --incorrect-bg:#fee2e2;
  --incorrect-border:#ef4444;
  --shadow-md:0 12px 30px rgba(11,31,56,.12);
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--light-bg);
  color:var(--text-dark);
  min-height:100vh;
  margin:0;
}
.quiz-header{
  background:var(--primary-blue);
  color:#fff;
  border-bottom:4px solid var(--gold);
  padding:1.15rem 1.5rem;
  box-shadow:0 8px 24px rgba(11,31,56,.13);
}
.quiz-header-inner{
  width:min(1200px,calc(100% - 2rem));
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
}
.quiz-header h1{
  font-size:clamp(2rem,3.8vw,2.8rem);
  line-height:1.08;
  margin:0;
  font-weight:850;
  letter-spacing:-.02em;
  color:#fff;
  text-align:left;
}
.back-link-header{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.28);
  padding:.82rem 1rem;
  border-radius:9px;
  font-weight:800;
  white-space:nowrap;
}
.back-link-header:hover{background:rgba(255,255,255,.18)}
.quiz-main{
  min-height:calc(100vh - 98px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:3rem 1.25rem;
}
.quiz-container{
  background-color:#fff;
  border-radius:12px;
  box-shadow:var(--shadow-md);
  width:100%;
  max-width:850px;
  padding:40px;
}
.progress{
  text-align:center;
  color:var(--text-muted);
  font-size:15px;
  margin-bottom:30px;
  font-weight:700;
}
.question{
  font-size:20px;
  font-weight:750;
  margin-bottom:25px;
  line-height:1.5;
  color:var(--text-dark);
}
.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.option{
  background-color:#f8fafc;
  border:2px solid var(--border-color);
  border-radius:8px;
  padding:16px;
  font-size:16px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  font-weight:500;
  color:#48617d;
  line-height:1.45;
}
.option:hover:not(:disabled){
  background-color:#eef4fa;
  border-color:#b8c8d8;
}
.option.correct{
  background-color:var(--correct-bg)!important;
  border-color:var(--correct-border)!important;
  color:#065f46!important;
  font-weight:700;
}
.option.incorrect{
  background-color:var(--incorrect-bg)!important;
  border-color:var(--incorrect-border)!important;
  color:#991b1b!important;
}
.option:disabled{cursor:default}
.feedback{
  margin-top:25px;
  font-size:16px;
  text-align:left;
  min-height:24px;
  padding:15px;
  border-radius:8px;
  display:none;
  line-height:1.5;
}
.feedback.success{
  background-color:var(--correct-bg);
  color:#065f46;
  border-left:5px solid var(--correct-border);
}
.feedback.error{
  background-color:var(--incorrect-bg);
  color:#991b1b;
  border-left:5px solid var(--incorrect-border);
}
.btn-container{
  display:flex;
  justify-content:flex-end;
  margin-top:30px;
}
.next-btn{
  background-color:var(--secondary-blue);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:14px 28px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:background-color .2s;
  display:none;
}
.next-btn:hover{background-color:var(--primary-blue)}
.result-container{
  text-align:center;
  display:none;
}
.result-container h2{
  color:var(--primary-blue);
  font-size:30px;
  margin-bottom:20px;
}
.result-container p{
  font-size:20px;
  color:#4a5568;
  margin-bottom:30px;
}
.score-circle{
  width:150px;
  height:150px;
  border-radius:50%;
  background:var(--primary-blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  font-weight:850;
  margin:0 auto 24px auto;
}
.restart-btn{
  background-color:var(--secondary-blue);
  color:white;
  border:none;
  border-radius:8px;
  padding:14px 28px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}
.restart-btn:hover{background-color:var(--primary-blue)}
@media(max-width:760px){
  .quiz-header-inner{
    width:100%;
    flex-direction:column;
    align-items:stretch;
  }
  .back-link-header{width:100%}
  .quiz-container{padding:28px 20px}
}
  </style>
</head>
<body>
<header class="quiz-header">
  <div class="quiz-header-inner">
    <h1>YouTube Ads Quiz</h1>
    <a class="back-link-header" href="index.html">← Zurück zur Übersicht</a>
  </div>
</header>

<main class="quiz-main">
  <div class="quiz-container">
    <div id="quiz">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-container">
        <button class="next-btn" id="nextBtn">Weiter</button>
      </div>
    </div>

    <div class="result-container" id="result">
      <div class="score-circle" id="scoreCircle">0</div>
      <h2>Quiz abgeschlossen</h2>
      <p id="scoreText"></p>
      <button class="restart-btn" onclick="restartQuiz()">Nochmal starten</button>
    </div>
  </div>
</main>

<script>
const questions = [
  {
    "q": "Welche Aussage beschreibt YouTube im Performance-Marketing am besten?",
    "options": [
      "YouTube ist nur ein Kanal für private Unterhaltung",
      "YouTube verbindet Suchverhalten, Video-Content, Google Ads und messbare Kampagnenziele",
      "YouTube kann nicht für bezahlte Werbung genutzt werden",
      "YouTube ersetzt grundsätzlich jede Website"
    ],
    "answer": 1,
    "explanation": "YouTube ist im Kurs als Such-, Video- und Performance-Kanal im Google-Ökosystem eingeordnet."
  },
  {
    "q": "Warum sind Videos besonders stark für erklärungsbedürftige Produkte?",
    "options": [
      "Weil Videos keine Zielgruppe benötigen",
      "Weil sie Mimik, Stimme, Musik und Storytelling verbinden und Vertrauen aufbauen können",
      "Weil sie immer kostenlos ausgespielt werden",
      "Weil sie keine Landingpage brauchen"
    ],
    "answer": 1,
    "explanation": "Videos können Emotion, Vertrauen und Verständnis transportieren – besonders bei erklärungsbedürftigen oder teureren Angeboten."
  },
  {
    "q": "Was bedeutet Owned Media auf YouTube?",
    "options": [
      "Bezahlte Anzeigen mit Budgeteinsatz",
      "Der eigene Kanal mit eigenen Videos, Shorts oder Produktvideos",
      "Zufällige Kommentare fremder Nutzerinnen",
      "Eine Kampagne ohne Zielgruppe"
    ],
    "answer": 1,
    "explanation": "Owned Media meint eigene Medien, also zum Beispiel den eigenen YouTube-Kanal und eigene Videos."
  },
  {
    "q": "Welches Kampagnenziel passt, wenn möglichst viele Menschen ein Video ansehen sollen?",
    "options": [
      "Video-Aufrufe",
      "Customer Match",
      "Post-Roll",
      "Consent Mode"
    ],
    "answer": 0,
    "explanation": "Video-Aufrufe sind das passende Ziel, wenn möglichst viele Personen das Video ansehen sollen."
  },
  {
    "q": "Welche Kennzahl zeigt, wie viel ein Videoaufruf kostet?",
    "options": [
      "CPV",
      "CTR",
      "CPA",
      "VTC"
    ],
    "answer": 0,
    "explanation": "CPV steht für Cost-per-View und zeigt die Kosten pro Aufruf."
  },
  {
    "q": "Was misst die View-Rate im YouTube-Kontext?",
    "options": [
      "Wie viel Umsatz pro Werbe-Euro entsteht",
      "Wie viele Nutzerinnen das Video mindestens eine bestimmte Zeit angesehen haben",
      "Wie viele Rechnungen erstellt wurden",
      "Wie viele Keywords in der Anzeige stehen"
    ],
    "answer": 1,
    "explanation": "Die View-Rate zeigt, wie viel Prozent der Nutzerinnen das Video ausreichend lange angesehen haben."
  },
  {
    "q": "Welche Funnel-Stufe steht für Aufmerksamkeit bei neuen Zielgruppen?",
    "options": [
      "TOFU",
      "MOFU",
      "BOFU",
      "CAPI"
    ],
    "answer": 0,
    "explanation": "TOFU steht für Top of Funnel und dient dazu, neue Personen auf Marke oder Produkt aufmerksam zu machen."
  },
  {
    "q": "Welche Formate passen laut Kurs besonders zu TOFU?",
    "options": [
      "Bumper Ads, Skippable Ads und YouTube Shorts Ads",
      "Nur Lead-Formulare",
      "Nur Customer Match",
      "Nur Post-Roll-Anzeigen ohne Ziel"
    ],
    "answer": 0,
    "explanation": "TOFU nutzt aufmerksamkeitsstarke Formate wie Bumper Ads, Skippable Ads und Shorts Ads."
  },
  {
    "q": "Wofür steht MOFU im YouTube-Funnel?",
    "options": [
      "Vertrauen und Interesse vertiefen",
      "Nur Abrechnung prüfen",
      "Nur Reichweite ohne Inhalt erzeugen",
      "Alle Zielgruppen ausschließen"
    ],
    "answer": 0,
    "explanation": "MOFU bedeutet Middle of Funnel. Hier werden Interesse, Vertrauen und Produktverständnis aufgebaut."
  },
  {
    "q": "Welche Inhalte passen besonders gut zu MOFU?",
    "options": [
      "Tutorials, Testimonials, Produktvergleiche und Kundenmeinungen",
      "Nur Impressumstexte",
      "Nur Preislisten ohne Erklärung",
      "Nur Zielgruppen-Ausschlüsse"
    ],
    "answer": 0,
    "explanation": "MOFU beantwortet Fragen wie: Ist das Produkt gut? Dafür eignen sich erklärende und vertrauensbildende Inhalte."
  },
  {
    "q": "Welche Funnel-Stufe passt am besten zu Retargeting und Kaufabschluss?",
    "options": [
      "BOFU",
      "TOFU",
      "MOFU",
      "Owned Media"
    ],
    "answer": 0,
    "explanation": "BOFU steht für Bottom of Funnel. Hier sollen Käufe, Registrierungen, Anfragen oder andere Conversions ausgelöst werden."
  },
  {
    "q": "Welche KPI ist bei BOFU besonders wichtig?",
    "options": [
      "Conversion-Rate oder Cost-per-Conversion",
      "Nur Anzahl der Kanalbanner",
      "Nur Video-Länge",
      "Nur Anzahl der Hashtags"
    ],
    "answer": 0,
    "explanation": "Bei BOFU geht es um Handlungen. Deshalb sind Conversion-Rate, Cost-per-Conversion und VTC wichtig."
  },
  {
    "q": "Welche Formel beschreibt YouTube-Strategie laut Vorlesung am besten?",
    "options": [
      "Zielgruppe + Funnel + Video-Inhalt + Messung",
      "Logo + Musik + Zufall + Likes",
      "Budget + Farbe + Schriftart + Kommentar",
      "Suchanzeige + Print + Radio + Plakat"
    ],
    "answer": 0,
    "explanation": "Die Strategie wird im Kurs über Zielgruppe, Funnel-Phase, Video-Inhalt sowie Messung und Optimierung erklärt."
  },
  {
    "q": "Was sind In-Market Audiences?",
    "options": [
      "Nutzerinnen mit aktueller Kaufabsicht in einer Google-Kategorie",
      "Menschen ohne jedes Interesse",
      "Nur bestehende Mitarbeitende",
      "Ein YouTube-Videoformat"
    ],
    "answer": 0,
    "explanation": "In-Market Audiences erreichen Nutzerinnen, die gerade ein konkretes Kaufinteresse zeigen."
  },
  {
    "q": "Was ist Customer Match?",
    "options": [
      "Der Upload eigener verschlüsselter Kundendaten als First-Party-Daten",
      "Ein automatisch erstelltes Musikvideo",
      "Ein Kommentarbereich im YouTube Studio",
      "Eine reine CPM-Abrechnung"
    ],
    "answer": 0,
    "explanation": "Customer Match nutzt eigene Kundendaten, zum Beispiel CRM- oder Newsletter-Listen, als Signal für die Google-KI."
  },
  {
    "q": "Was bedeutet Audience Prediction?",
    "options": [
      "Die Plattform erkennt automatisiert, welche Nutzerinnen wahrscheinlich konvertieren",
      "Ein Mensch wählt jede einzelne Person manuell aus",
      "Alle Anzeigen werden ohne Daten ausgespielt",
      "Nur die Videolänge wird gemessen"
    ],
    "answer": 0,
    "explanation": "Audience Prediction heißt, dass Google mithilfe von Signalen vorhersagt, welche Nutzerinnen am ehesten ein Ziel erreichen."
  },
  {
    "q": "Wie verändert KI-Targeting die Kampagnensteuerung?",
    "options": [
      "Marketer setzen Signale, die Plattform lernt und optimiert eigenständig weiter",
      "Alle Zielgruppen werden dauerhaft starr festgelegt",
      "Kampagnen funktionieren ohne Conversion-Ziel besser",
      "Google Ads wird dadurch unnötig"
    ],
    "answer": 0,
    "explanation": "Im modernen Targeting werden Zielgruppensignale als Startpunkt genutzt. Die Google-KI optimiert dann laufend weiter."
  },
  {
    "q": "Wann ist YouTube Studio eher geeignet?",
    "options": [
      "Wenn ein Clip schnell für mehr Views oder Abonnenten gepusht werden soll",
      "Wenn gezielt Leads und Sales mit vollem Conversion-Tracking optimiert werden sollen",
      "Wenn Performance Max genutzt werden soll",
      "Wenn Customer Match hochgeladen werden soll"
    ],
    "answer": 0,
    "explanation": "YouTube Studio ist eher für Kanalwachstum, Views und Abonnenten geeignet – nicht für echte Conversion-Optimierung."
  },
  {
    "q": "Wann ist Google Ads für YouTube die bessere Wahl?",
    "options": [
      "Wenn professionell gemessen, getestet und auf Conversions optimiert werden soll",
      "Wenn nur ein Video privat gespeichert werden soll",
      "Wenn keine Zielseite vorhanden sein darf",
      "Wenn keinerlei Tracking gebraucht wird"
    ],
    "answer": 0,
    "explanation": "Google Ads bietet volles Conversion-Tracking, Zielgruppensignale, Demand Gen und Performance Max."
  },
  {
    "q": "Welche Aussage zu Video-Assets in modernen YouTube-Performance-Kampagnen ist richtig?",
    "options": [
      "Verschiedene Ausrichtungen wie 9:16, 16:9 und 1:1 helfen der Google-KI bei der Ausspielung",
      "Es darf immer nur ein Querformat-Video hochgeladen werden",
      "Shorts sind grundsätzlich verboten",
      "Die Videoausrichtung hat nie Einfluss auf die Kampagne"
    ],
    "answer": 0,
    "explanation": "Im Kurs wird empfohlen, unterschiedliche Video-Ausrichtungen bereitzustellen, damit die Google-KI passende Formate ausspielen kann."
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const progressEl = document.getElementById('progress');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizEl = document.getElementById('quiz');
const resultEl = document.getElementById('result');
const scoreTextEl = document.getElementById('scoreText');
const scoreCircleEl = document.getElementById('scoreCircle');

function loadQuestion(){
  answered = false;
  const q = questions[currentQuestion];
  progressEl.textContent = `Frage ${currentQuestion + 1} von ${questions.length}`;
  questionEl.textContent = `${currentQuestion + 1}. ${q.q}`;
  optionsEl.innerHTML = '';
  feedbackEl.style.display = 'none';
  feedbackEl.className = 'feedback';
  nextBtn.style.display = 'none';

  q.options.forEach((option, index) => {
    const button = document.createElement('button');
    button.className = 'option';
    button.textContent = `${String.fromCharCode(65 + index)}) ${option}`;
    button.addEventListener('click', () => selectOption(index, button));
    optionsEl.appendChild(button);
  });
}

function selectOption(index, button){
  if(answered) return;
  answered = true;

  const q = questions[currentQuestion];
  const optionButtons = document.querySelectorAll('.option');
  optionButtons.forEach(btn => btn.disabled = true);

  if(index === q.answer){
    score++;
    button.classList.add('correct');
    feedbackEl.textContent = 'Richtig. ' + q.explanation;
    feedbackEl.classList.add('success');
  } else {
    button.classList.add('incorrect');
    optionButtons[q.answer].classList.add('correct');
    feedbackEl.textContent = 'Nicht ganz. ' + q.explanation;
    feedbackEl.classList.add('error');
  }

  feedbackEl.style.display = 'block';
  nextBtn.style.display = 'inline-block';
}

nextBtn.addEventListener('click', () => {
  currentQuestion++;
  if(currentQuestion < questions.length){
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult(){
  quizEl.style.display = 'none';
  resultEl.style.display = 'block';
  scoreCircleEl.textContent = score;
  scoreTextEl.textContent = `Du hast ${score} von ${questions.length} Fragen richtig beantwortet.`;
}

function restartQuiz(){
  currentQuestion = 0;
  score = 0;
  quizEl.style.display = 'block';
  resultEl.style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
