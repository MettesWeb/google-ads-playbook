<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Landing Pages Quiz</title>
  <style>
:root{
  --primary-blue:#0f5132;
  --secondary-blue:#16834f;
  --gold:#c8a84e;
  --light-bg:#f4fbf7;
  --card-bg:#ffffff;
  --border-color:#dbeee2;
  --text-dark:#123326;
  --text-muted:#5f7569;
  --correct-bg:#d1fae5;
  --correct-border:#10b981;
  --incorrect-bg:#fee2e2;
  --incorrect-border:#ef4444;
  --shadow-md:0 12px 30px rgba(15,81,50,.12);
}
*{box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--light-bg);
  color:var(--text-dark);
  min-height:100vh;
  margin:0;
}
.quiz-header{
  background:var(--primary-blue);
  color:#fff;
  border-bottom:4px solid var(--gold);
  padding:1.15rem 1.5rem;
  box-shadow:0 8px 24px rgba(15,81,50,.13);
}
.quiz-header-inner{
  width:min(1200px,calc(100% - 2rem));
  margin:0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:1rem;
}
.quiz-header h1{
  font-size:clamp(2rem,3.8vw,2.8rem);
  line-height:1.08;
  margin:0;
  font-weight:850;
  letter-spacing:-.02em;
  color:#fff;
  text-align:left;
}
.back-link-header{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.28);
  padding:.82rem 1rem;
  border-radius:9px;
  font-weight:800;
  white-space:nowrap;
}
.back-link-header:hover{background:rgba(255,255,255,.18)}
.quiz-main{
  min-height:calc(100vh - 98px);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:3rem 1.25rem;
}
.quiz-container{
  background-color:#fff;
  border-radius:12px;
  box-shadow:var(--shadow-md);
  width:100%;
  max-width:850px;
  padding:40px;
}
.progress{
  text-align:center;
  color:var(--text-muted);
  font-size:15px;
  margin-bottom:30px;
  font-weight:700;
}
.question{
  font-size:20px;
  font-weight:750;
  margin-bottom:25px;
  line-height:1.5;
  color:var(--text-dark);
}
.options{display:flex;flex-direction:column;gap:12px}
.option{
  background-color:#f8fffb;
  border:2px solid var(--border-color);
  border-radius:8px;
  padding:16px;
  font-size:16px;
  cursor:pointer;
  transition:all .2s ease;
  text-align:left;
  font-weight:500;
  color:#416552;
  line-height:1.45;
}
.option:hover:not(:disabled){background-color:#e8f8ee;border-color:#bfe4ca}
.option.correct{background-color:var(--correct-bg)!important;border-color:var(--correct-border)!important;color:#065f46!important;font-weight:700}
.option.incorrect{background-color:var(--incorrect-bg)!important;border-color:var(--incorrect-border)!important;color:#991b1b!important}
.option:disabled{cursor:default}
.feedback{
  margin-top:25px;
  font-size:16px;
  text-align:left;
  min-height:24px;
  padding:15px;
  border-radius:8px;
  display:none;
  line-height:1.5;
}
.feedback.success{background-color:var(--correct-bg);color:#065f46;border-left:5px solid var(--correct-border)}
.feedback.error{background-color:var(--incorrect-bg);color:#991b1b;border-left:5px solid var(--incorrect-border)}
.btn-container{display:flex;justify-content:flex-end;margin-top:30px}
.next-btn{
  background-color:var(--secondary-blue);
  color:#fff;
  border:none;
  border-radius:8px;
  padding:14px 28px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
  transition:background-color .2s;
  display:none;
}
.next-btn:hover{background-color:var(--primary-blue)}
.result-container{text-align:center;display:none}
.result-container h2{color:var(--primary-blue);font-size:30px;margin-bottom:20px}
.result-container p{font-size:20px;color:#4a5568;margin-bottom:30px}
.score-circle{
  width:150px;
  height:150px;
  border-radius:50%;
  background:var(--primary-blue);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:46px;
  font-weight:850;
  margin:0 auto 24px auto;
}
.restart-btn{background-color:var(--secondary-blue);color:white;border:none;border-radius:8px;padding:14px 28px;font-size:16px;font-weight:800;cursor:pointer}
.restart-btn:hover{background-color:var(--primary-blue)}
@media(max-width:760px){
  .quiz-header-inner{width:100%;flex-direction:column;align-items:stretch}
  .back-link-header{width:100%}
  .quiz-container{padding:28px 20px}
}
</style>
</head>
<body>
<header class="quiz-header">
  <div class="quiz-header-inner">
    <h1>Landing Pages Quiz</h1>
    <a class="back-link-header" href="spezi1.html">← Zur grünen Übersicht</a>
  </div>
</header>

<main class="quiz-main">
  <div class="quiz-container">
    <div id="quiz">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-container"><button class="next-btn" id="nextBtn">Weiter</button></div>
    </div>

    <div class="result-container" id="result">
      <div class="score-circle" id="scoreCircle">0</div>
      <h2>Quiz abgeschlossen</h2>
      <p id="scoreText"></p>
      <button class="restart-btn" onclick="restartQuiz()">Nochmal starten</button>
    </div>
  </div>
</main>

<script>
const questions = [
  {
    "q": "Was ist das Hauptziel einer Landingpage?",
    "options": [
      "Eine konkrete Conversion auslösen",
      "Möglichst viele Themen gleichzeitig zeigen",
      "Nur das Firmenlogo präsentieren",
      "Alle Blogartikel sammeln"
    ],
    "answer": 0,
    "explanation": "Eine Landingpage ist auf eine konkrete Zielhandlung wie Kauf, Anmeldung, Download oder Terminbuchung ausgerichtet."
  },
  {
    "q": "Wie unterscheidet sich eine Landingpage von einer Startseite?",
    "options": [
      "Sie ist breiter und hat mehr Wege",
      "Sie ist fokussierter und führt zu einer klaren Entscheidung",
      "Sie darf keinen CTA enthalten",
      "Sie ist nur für Desktop gedacht"
    ],
    "answer": 1,
    "explanation": "Eine Landingpage ist maximal reduziert und auf ein Kampagnenziel ausgerichtet."
  },
  {
    "q": "Welche Funnel-Stufe steht für Awareness?",
    "options": [
      "TOFU",
      "MOFU",
      "BOFU",
      "Footer"
    ],
    "answer": 0,
    "explanation": "TOFU ist der obere Funnel-Bereich und dient eher Awareness und erster Orientierung."
  },
  {
    "q": "Was bedeutet Above the Fold?",
    "options": [
      "Der sofort sichtbare Bereich ohne Scrollen",
      "Der Footer der Seite",
      "Der Bereich nach der Datenschutzseite",
      "Ein technisches Tracking-Skript"
    ],
    "answer": 0,
    "explanation": "Above the Fold ist der Bereich, den Nutzer*innen ohne Scrollen zuerst sehen."
  },
  {
    "q": "Was gehört besonders in den Above-the-Fold-Bereich?",
    "options": [
      "Value Proposition, Hero-Element, CTA und Vertrauen",
      "Nur AGB und Impressum",
      "Alle Bloglinks",
      "Eine lange Unternehmensgeschichte"
    ],
    "answer": 0,
    "explanation": "Oben muss sofort klar sein: Warum bleiben, was tun, warum vertrauen?"
  },
  {
    "q": "Was ist eine Value Proposition?",
    "options": [
      "Das zentrale Nutzen- und Wertversprechen",
      "Eine Cookie-Laufzeit",
      "Ein PageSpeed-Tool",
      "Ein Kommentarfilter"
    ],
    "answer": 0,
    "explanation": "Sie beantwortet, warum das Angebot relevant ist und welches Problem gelöst wird."
  },
  {
    "q": "Welche Aufgabe hat Below the Fold?",
    "options": [
      "Argumente vertiefen, Vertrauen stärken und Einwände abbauen",
      "Nur den Header wiederholen",
      "Den CTA verstecken",
      "Alle Social-Media-Links zeigen"
    ],
    "answer": 0,
    "explanation": "Below the Fold stützt die Entscheidung durch Argumentation, Social Proof, FAQs und Pflichtangaben."
  },
  {
    "q": "Was ist ein typischer Aufbaufehler bei Landingpages?",
    "options": [
      "Zu viele Ablenkungen und mehrere konkurrierende CTAs",
      "Klares Wertversprechen",
      "Kurzes Formular",
      "Sichtbare Trust-Elemente"
    ],
    "answer": 0,
    "explanation": "Zu viele Menüs, Links oder CTAs stören den Fokus der Landingpage."
  },
  {
    "q": "Warum ist Scanbarkeit wichtig?",
    "options": [
      "Nutzer*innen überfliegen Landingpages oft statt sie komplett zu lesen",
      "Niemand klickt auf Landingpages",
      "Landingpages dürfen keine Texte haben",
      "Suchmaschinen lesen nur Bilder"
    ],
    "answer": 0,
    "explanation": "Layout, Headlines, Bulletpoints und Chunking helfen beim schnellen Erfassen."
  },
  {
    "q": "Was ist Visual Storytelling auf Landingpages?",
    "options": [
      "Bilder und Videos machen den Nutzen erlebbar",
      "Bilder schmücken nur die Seite",
      "Nur Stockfotos verwenden",
      "Texte komplett ersetzen"
    ],
    "answer": 0,
    "explanation": "Visuals sollen den Nutzen unterstützen und nicht nur dekorativ sein."
  },
  {
    "q": "Was ist bei CTA-Texten besser als „Absenden“?",
    "options": [
      "„Jetzt kostenlos testen“",
      "„Button“",
      "„Weiter eventuell“",
      "„Formular senden“"
    ],
    "answer": 0,
    "explanation": "Gute CTA-Texte sind aktiv, nutzenorientiert und konkret."
  },
  {
    "q": "Warum ist Mobile First wichtig?",
    "options": [
      "Viele Nutzer*innen kommen mobil, oft über Social Media oder Paid Ads",
      "Desktop ist rechtlich verboten",
      "Mobile Seiten brauchen keine CTAs",
      "Google ignoriert mobile Seiten"
    ],
    "answer": 0,
    "explanation": "Mobile Nutzung dominiert viele E-Commerce-, Social- und Paid-Ad-Situationen."
  },
  {
    "q": "Welche mobile Formularregel ist richtig?",
    "options": [
      "Weniger Pflichtfelder, Autofill und Inline-Fehler nutzen",
      "Möglichst viele Pflichtfelder verlangen",
      "Fehler erst nach Absenden anzeigen",
      "Nur Freitextfelder verwenden"
    ],
    "answer": 0,
    "explanation": "Mobile Formulare müssen Reibung reduzieren."
  },
  {
    "q": "Was bedeutet Thumb-Zone?",
    "options": [
      "Der Bereich, den der Daumen bequem erreicht",
      "Der Footer einer Seite",
      "Ein Bildformat",
      "Ein Tracking-Cookie"
    ],
    "answer": 0,
    "explanation": "Haupt-CTAs sollten mobil ergonomisch erreichbar sein."
  },
  {
    "q": "Was ist Social Proof?",
    "options": [
      "Menschen orientieren sich an dem Verhalten und den Erfahrungen anderer",
      "Eine JavaScript-Datei",
      "Ein reines Zahlungsmodell",
      "Ein Serverstatus"
    ],
    "answer": 0,
    "explanation": "Bewertungen, Testimonials und Zahlenbelege können Vertrauen stärken."
  },
  {
    "q": "Was ist FOMO?",
    "options": [
      "Fear of Missing Out – Angst, etwas zu verpassen",
      "Eine Core-Web-Vital-Metrik",
      "Ein Formularfeld",
      "Ein SEO-Plugin"
    ],
    "answer": 0,
    "explanation": "FOMO kann durch echte Knappheit oder zeitliche Begrenzung Handlungsdruck erzeugen."
  },
  {
    "q": "Was ist Microcopy?",
    "options": [
      "Kurze Texte, die Nutzer*innen durch Entscheidungen führen",
      "Ein langer Blogartikel",
      "Ein großes Hero-Bild",
      "Ein Affiliate-Link"
    ],
    "answer": 0,
    "explanation": "Microcopy steht an Buttons, Formularen, Fehlermeldungen oder Checkout-Schritten."
  },
  {
    "q": "Welcher Core Web Vital misst, wie schnell der Hauptinhalt sichtbar wird?",
    "options": [
      "LCP",
      "INP",
      "CLS",
      "CPL"
    ],
    "answer": 0,
    "explanation": "LCP steht für Largest Contentful Paint."
  },
  {
    "q": "Was beschreibt CLS?",
    "options": [
      "Ob Layout-Elemente beim Laden springen",
      "Wie viele Leads entstehen",
      "Wie schnell ein Support antwortet",
      "Wie hoch der Warenkorb ist"
    ],
    "answer": 0,
    "explanation": "Cumulative Layout Shift misst visuelle Stabilität."
  },
  {
    "q": "Welche Aussage zu KI-Feedback für Landingpages ist richtig?",
    "options": [
      "KI kann Muster erkennen, ersetzt aber keine echten Nutzertests und keine eigene Einschätzung",
      "KI entscheidet immer allein",
      "KI kennt die Zielgruppe automatisch besser",
      "KI macht rechtliche Prüfung überflüssig"
    ],
    "answer": 0,
    "explanation": "KI-Feedback ist hilfreich als Anregung, muss aber kritisch geprüft werden."
  }
];

let currentQuestion=0, score=0, answered=false;
const progressEl=document.getElementById('progress');
const questionEl=document.getElementById('question');
const optionsEl=document.getElementById('options');
const feedbackEl=document.getElementById('feedback');
const nextBtn=document.getElementById('nextBtn');
const quizEl=document.getElementById('quiz');
const resultEl=document.getElementById('result');
const scoreTextEl=document.getElementById('scoreText');
const scoreCircleEl=document.getElementById('scoreCircle');

function loadQuestion(){
  answered=false;
  const q=questions[currentQuestion];
  progressEl.textContent=`Frage ${currentQuestion+1} von ${questions.length}`;
  questionEl.textContent=`${currentQuestion+1}. ${q.q}`;
  optionsEl.innerHTML='';
  feedbackEl.style.display='none';
  feedbackEl.className='feedback';
  nextBtn.style.display='none';
  q.options.forEach((option,index)=>{
    const button=document.createElement('button');
    button.className='option';
    button.textContent=`${String.fromCharCode(65+index)}) ${option}`;
    button.addEventListener('click',()=>selectOption(index,button));
    optionsEl.appendChild(button);
  });
}

function selectOption(index,button){
  if(answered)return;
  answered=true;
  const q=questions[currentQuestion];
  const optionButtons=document.querySelectorAll('.option');
  optionButtons.forEach(btn=>btn.disabled=true);
  optionButtons[q.answer].classList.add('correct');
  if(index===q.answer){
    score++;
    feedbackEl.textContent='Richtig. '+q.explanation;
    feedbackEl.classList.add('success');
  }else{
    button.classList.add('incorrect');
    feedbackEl.textContent='Nicht ganz. '+q.explanation;
    feedbackEl.classList.add('error');
  }
  feedbackEl.style.display='block';
  nextBtn.textContent=currentQuestion<questions.length-1?'Weiter':'Ergebnis anzeigen';
  nextBtn.style.display='inline-block';
}

nextBtn.addEventListener('click',()=>{
  currentQuestion++;
  if(currentQuestion<questions.length){loadQuestion();}else{showResult();}
});

function showResult(){
  quizEl.style.display='none';
  resultEl.style.display='block';
  scoreCircleEl.textContent=score;
  scoreTextEl.textContent=`Du hast ${score} von ${questions.length} Fragen richtig beantwortet.`;
}

function restartQuiz(){
  currentQuestion=0;
  score=0;
  quizEl.style.display='block';
  resultEl.style.display='none';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
