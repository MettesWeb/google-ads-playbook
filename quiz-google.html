*{box-sizing:border-box}

  margin-bottom:25px;
  line-height:1.5;

}
.options{display:flex;flex-direction:column;gap:12px}

  border-radius:8px;
  padding:16px;
  font-size:16px;
  cursor:pointer;

  text-align:left;
  font-weight:500;
  color:#48617d;
  line-height:1.45;
}

.option.incorrect{background-color:var(--incorrect-bg)!important;border-color:var(--incorrect-border)!important;color:#991b1b!important}

  margin-top:25px;
  font-size:16px;
  text-align:left;
  min-height:24px;
  padding:15px;
  border-radius:8px;
  display:none;
  line-height:1.5;
}

.feedback.error{background-color:var(--incorrect-bg);color:#991b1b;border-left:5px solid var(--incorrect-border)}

  display:flex;
  align-items:center;

let currentQuestion = 0;
let score = 0;
let answered = false;
const progressEl = document.getElementById('progress');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizEl = document.getElementById('quiz');
const resultEl = document.getElementById('result');
const scoreTextEl = document.getElementById('scoreText');
const scoreCircleEl = document.getElementById('scoreCircle');
function loadQuestion(){
  answered = false;
  const q = questions[currentQuestion];
  progressEl.textContent = `Frage ${currentQuestion + 1} von ${questions.length}`;
  questionEl.textContent = `${currentQuestion + 1}. ${q.q}`;
  optionsEl.innerHTML = '';
  feedbackEl.style.display = 'none';
  feedbackEl.className = 'feedback';
  nextBtn.style.display = 'none';
  q.options.forEach((option, index) => {
    const button = document.createElement('button');
    button.className = 'option';
    button.textContent = `${String.fromCharCode(65 + index)}) ${option}`;
    button.addEventListener('click', () => selectOption(index, button));
    optionsEl.appendChild(button);
  });
}
function selectOption(index, button){
  if(answered) return;
  answered = true;
  const q = questions[currentQuestion];
  const optionButtons = document.querySelectorAll('.option');
  optionButtons.forEach(btn => btn.disabled = true);
  if(index === q.answer){
    score++;
    button.classList.add('correct');
    feedbackEl.textContent = 'Richtig. ' + q.explanation;
    feedbackEl.classList.add('success');
  } else {
    button.classList.add('incorrect');
    optionButtons[q.answer].classList.add('correct');
    feedbackEl.textContent = 'Nicht ganz. ' + q.explanation;
    feedbackEl.classList.add('error');
  }
  feedbackEl.style.display = 'block';
  nextBtn.style.display = 'inline-block';
}
nextBtn.addEventListener('click', () => {
  currentQuestion++;
  if(currentQuestion < questions.length){loadQuestion();} else {showResult();}
});
function showResult(){
  quizEl.style.display = 'none';
  resultEl.style.display = 'block';
  scoreCircleEl.textContent = score;
  scoreTextEl.textContent = `Du hast ${score} von ${questions.length} Fragen richtig beantwortet.`;
}
function restartQuiz(){
  currentQuestion = 0;
  score = 0;
  quizEl.style.display = 'block';
  resultEl.style.display = 'none';
  loadQuestion();
}
loadQuestion();
</script>
