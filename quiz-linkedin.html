<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn &amp; HR Quiz</title>
<style>
:root{
  --primary:#0f5132;--secondary:#16834f;--gold:#c8a84e;--bg:#f4fbf7;--card:#fff;--border:#dbeee2;--text:#123326;--muted:#5f7569;--ok:#10b981;--bad:#ef4444;--shadow:0 12px 30px rgba(15,81,50,.12)
}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;margin:0}
.quiz-header{background:var(--primary);color:#fff;border-bottom:4px solid var(--gold);padding:1.15rem 1.5rem;box-shadow:0 8px 24px rgba(15,81,50,.13)}
.quiz-header-inner{width:min(1200px,calc(100% - 2rem));margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.quiz-header h1{font-size:clamp(2rem,3.8vw,2.8rem);line-height:1.08;margin:0;font-weight:850;letter-spacing:-.02em;color:#fff;text-align:left}
.back-link-header{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);padding:.82rem 1rem;border-radius:9px;font-weight:800;white-space:nowrap}
.back-link-header:hover{background:rgba(255,255,255,.18)}
.quiz-main{min-height:calc(100vh - 98px);display:flex;justify-content:center;align-items:flex-start;padding:3rem 1.25rem}
.quiz-container{background-color:#fff;border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:850px;padding:40px}
.progress{text-align:center;color:var(--muted);font-size:15px;margin-bottom:30px;font-weight:700}
.question{font-size:20px;font-weight:750;margin-bottom:25px;line-height:1.5;color:var(--text)}
.options{display:flex;flex-direction:column;gap:12px}
.option{background-color:#f8fffb;border:2px solid var(--border);border-radius:8px;padding:16px;font-size:16px;cursor:pointer;transition:all .2s ease;text-align:left;font-weight:500;color:#416552;line-height:1.45}
.option:hover:not(:disabled){background-color:#e8f8ee;border-color:#bfe4ca}
.option.correct{background-color:#d1fae5!important;border-color:var(--ok)!important;color:#065f46!important;font-weight:700}
.option.incorrect{background-color:#fee2e2!important;border-color:var(--bad)!important;color:#991b1b!important}
.option:disabled{cursor:default}
.feedback{margin-top:25px;font-size:16px;text-align:left;min-height:24px;padding:15px;border-radius:8px;display:none;line-height:1.5}
.feedback.success{background-color:#d1fae5;color:#065f46;border-left:5px solid var(--ok)}
.feedback.error{background-color:#fee2e2;color:#991b1b;border-left:5px solid var(--bad)}
.btn-container{display:flex;justify-content:flex-end;margin-top:30px}
.next-btn{background-color:var(--secondary);color:#fff;border:none;border-radius:8px;padding:14px 28px;font-size:16px;font-weight:800;cursor:pointer;display:none}
.next-btn:hover{background-color:var(--primary)}
.result-container{text-align:center;display:none}
.result-container h2{color:var(--primary);font-size:30px;margin-bottom:20px}
.result-container p{font-size:20px;color:#4a5568;margin-bottom:30px}
.score-circle{width:150px;height:150px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:850;margin:0 auto 24px auto}
.restart-btn{background-color:var(--secondary);color:white;border:none;border-radius:8px;padding:14px 28px;font-size:16px;font-weight:800;cursor:pointer}
.restart-btn:hover{background-color:var(--primary)}
@media(max-width:760px){.quiz-header-inner{width:100%;flex-direction:column;align-items:stretch}.back-link-header{width:100%}.quiz-container{padding:28px 20px}}
</style>
</head>
<body>
<header class="quiz-header">
  <div class="quiz-header-inner">
    <h1>LinkedIn &amp; HR Quiz</h1>
    <a class="back-link-header" href="spezi1.html">← Zur grünen Übersicht</a>
  </div>
</header>
<main class="quiz-main">
  <div class="quiz-container">
    <div id="quiz">
      <div class="progress" id="progress"></div>
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <div class="btn-container"><button class="next-btn" id="nextBtn">Weiter</button></div>
    </div>
    <div class="result-container" id="result">
      <div class="score-circle" id="scoreCircle">0</div>
      <h2>Quiz abgeschlossen</h2>
      <p id="scoreText"></p>
      <button class="restart-btn" onclick="restartQuiz()">Nochmal starten</button>
    </div>
  </div>
</main>
<script>
const questions = [
  {
    "q": "Was ist laut dem '360Brew Update' 2026 auf LinkedIn entscheidender für die Reichweite als einfache Likes?",
    "options": [
      "Eine extrem hohe Posting-Frequenz (mindestens 2x täglich).",
      "Externe Links zu anderen Plattformen in jedem Post.",
      "Saves (Speichern) & Kommentartiefe – ein Save hat ca. 5x mehr Reichweitenwirkung als ein Like.",
      "Die Nutzung von möglichst vielen Hashtags (mindestens 15)."
    ],
    "answer": 2,
    "explanation": "Ein Speichern (Save) hat ca. 5x mehr Reichweitenwirkung als ein Like, und substanzielle Diskussionen (Kommentartiefe) schlagen Massenreaktionen"
  },
  {
    "q": "Wie unterscheidet sich die organische Reichweite einer Company Page von der eines persönlichen Profils auf LinkedIn?",
    "options": [
      "Persönliche Profile werden vom Algorithmus bevorzugt, wodurch die organische Reichweite von Company Pages deutlich gesunken ist.",
      "Company Pages haben grundsätzlich eine viel höhere organische Reichweite als persönliche Profile.",
      "Es gibt keinen Unterschied, der Algorithmus behandelt beide gleich.",
      "Company Pages erreichen immer 100% ihrer Follower."
    ],
    "answer": 0,
    "explanation": "Persönliche Profile werden vom Algorithmus bevorzugt, wodurch die organische Reichweite von Company Pages deutlich gesunken ist und Paid Ads oder Mitarbeiter-Engagement nötig macht"
  },
  {
    "q": "Was versteht man unter dem Begriff 'Employee Advocacy' auf LinkedIn?",
    "options": [
      "Das automatisierte Löschen von Mitarbeiterprofilen bei Kündigung.",
      "Ein Premium-Abo für Arbeitssuchende.",
      "Ein Beschwerdemanagement-Tool für Angestellte.",
      "Die strategische Einbindung von Mitarbeitenden als authentische Markenbotschafter (Corporate Influencer)."
    ],
    "answer": 3,
    "explanation": "Mitarbeitende fungieren strategisch als authentische Markenbotschafter (Corporate Influencer), was die Reichweite oft um das 5-8-fache erhöht und das Vertrauen stärkt"
  },
  {
    "q": "Was ist der Hauptunterschied zwischen HR-Marketing und Employer Branding?",
    "options": [
      "HR-Marketing kümmert sich um Kündigungen, Employer Branding um Einstellungen.",
      "Employer Branding ist die Entwicklung der Arbeitgebermarke (Werte, Kultur), HR-Marketing umfasst die operativen Maßnahmen zu deren Vermarktung.",
      "Employer Branding ist nur für externe Bewerber, HR-Marketing nur für bestehende Mitarbeiter.",
      "Es gibt keinen Unterschied, die Begriffe sind absolute Synonyme."
    ],
    "answer": 1,
    "explanation": "Employer Branding ist die Entwicklung der Arbeitgebermarke (Werte, Kultur), während HR-Marketing die operativen Maßnahmen (z.B. Ads, Karriereseite) umfasst, um das Unternehmen attraktiv zu machen"
  },
  {
    "q": "Welche Kennzahl im HR-Marketing misst die Zeit von der Ausschreibung/Stellenfreigabe bis zur Vertragsunterschrift?",
    "options": [
      "Time-to-Hire",
      "Cost-per-Hire (CPH)",
      "Employee Net Promoter Score (eNPS)",
      "Click-to-Apply-Rate"
    ],
    "answer": 0,
    "explanation": "Die Kennzahl 'Time-to-Hire' misst die Dauer von der Stellenfreigabe bis zur finalen Einstellung eines Kandidaten"
  },
  {
    "q": "Wofür steht die Abkürzung 'eNPS' im Kontext der Mitarbeiterbindung?",
    "options": [
      "Employee Net Profit Share",
      "Engagement Number Per Staff",
      "Employee Net Promoter Score",
      "Employer New Placement System"
    ],
    "answer": 2,
    "explanation": "eNPS steht für Employee Net Promoter Score und misst die Zufriedenheit und Weiterempfehlungsbereitschaft der Mitarbeitenden ('Würden Sie uns als Arbeitgeber empfehlen?')"
  },
  {
    "q": "Zu welcher Medien-Kategorie (Kanal-Art) im HR-Marketing gehören positive Arbeitgeberbewertungen auf Kununu oder Glassdoor?",
    "options": [
      "Paid Media (Bezahlte Reichweite)",
      "Earned Media (",
      "Owned Media (Eigene Kanäle)",
      "Reichweite)",
      "B2B Media"
    ],
    "answer": 1,
    "explanation": "Sie gehören zur 'Verdienten' Reichweite (Earned Media), also zu kostenloser Aufmerksamkeit durch Dritte (wie Empfehlungen und Bewertungen)"
  },
  {
    "q": "Welches LinkedIn-Anzeigenformat verschickt interaktive Nachrichten direkt in das InMail-Postfach der Nutzer?",
    "options": [
      "Dynamic Ads",
      "Sponsored Content",
      "Job Ads",
      "Conversation Ads"
    ],
    "answer": 3,
    "explanation": "Conversation Ads sind interaktive Nachrichten-Kampagnen im InMail-Postfach mit Call-to-Action-Auswahl (Vorteil: persönliche Ansprache)"
  },
  {
    "q": "Welches Content-Format auf LinkedIn eignet sich laut Vorlesung besonders gut für How-tos, Checklisten und Case Studies?",
    "options": [
      "Live-Streams",
      "Dokument-Posts / Carousels",
      "Kurze reine Text-Posts",
      "Job Ads"
    ],
    "answer": 1,
    "explanation": "Dokument-Posts bzw. Carousels sind für diese Art von edukativen Inhalten (How-tos, Checklisten, Case Studies) das Format mit hoher Performance auf LinkedIn"
  },
  {
    "q": "Wie wird Pinterest im Marketing-Mix primär positioniert?",
    "options": [
      "Als visuelle Such- und Inspirationsplattform (",
      "Als B2B-Plattform für Steuerberater.",
      "Als reine Echtzeit-Nachrichtenplattform.",
      ") mit hoher Kaufabsicht.",
      "Als Live-Streaming-Plattform für Gamer."
    ],
    "answer": 0,
    "explanation": "Pinterest ist eine visuelle Such- und Inspirationsplattform ('Ideenmaschine'), die Inspiration für z. B. Lifestyle, DIY und Mode mit einer hohen Kaufabsicht verbindet"
  },
  {
    "q": "Welches Feature ist ein zentraler Treiber für E-Commerce-Erfolge (z.B. virtuelle Anprobe) auf Snapchat?",
    "options": [
      "Subreddits",
      "Twitch Drops",
      "Augmented Reality (AR) Lenses",
      "Document Ads"
    ],
    "answer": 2,
    "explanation": "Augmented Reality (AR) Lenses ermöglichen es Nutzern, Produkte virtuell anzuprobieren ('Try before you buy'), was die Kaufbereitschaft steigert und Retouren senkt"
  },
  {
    "q": "Was ist eine zentrale Herausforderung und ein Risiko beim Marketing auf der Plattform Reddit?",
    "options": [
      "Die maximale Videolänge beträgt nur 6 Sekunden.",
      "Es gibt dort überhaupt keine Werbeformate.",
      "Es ist nur für Frauen zwischen 18 und 24 Jahren relevant.",
      "Eine hohe Skepsis der Community gegenüber klassischer Werbung; pushy Content wird oft mit Downvotes oder Shitstorms abgestraft."
    ],
    "answer": 3,
    "explanation": "Es herrscht eine hohe Skepsis der Community gegenüber klassischer Werbung; aufdringlicher Content wird oft mit Downvotes oder Shitstorms abgestraft. Authentizität und Mehrwert sind extrem wichtig"
  },
  {
    "q": "Wie nennt man Belohnungen (z. B. In-Game-Items), die Nutzer auf Twitch für das Ansehen von Streams erhalten und die die Verweildauer steigern?",
    "options": [
      "Twitch Drops",
      "Snap Lenses",
      "Reddit AMAs",
      "Pinterest Collections"
    ],
    "answer": 0,
    "explanation": "Twitch Drops sind Belohnungen (z. B. In-Game-Items), die das Ansehen von Streams belohnen, die Verweildauer stark fördern und zu Shop-Besuchen führen können"
  },
  {
    "q": "Wofür eignet sich die Plattform X (ehemals Twitter) im E-Commerce besonders?",
    "options": [
      "Für das Hochladen von 3-stündigen Dokumentarfilmen.",
      "Für Trend Commerce, Trend Hijacking und Echtzeit-Social-Proof durch aktuelle Diskussionen.",
      "Für B2B-Recruiting über ausführliche Lebensläufe.",
      "Für Augmented Reality Filter."
    ],
    "answer": 1,
    "explanation": "X (Twitter) ist eine Echtzeit-Plattform, die sich exzellent für 'Trend Commerce' (Trend Hijacking) und Echtzeit-Social-Proof durch Diskussionen und Empfehlungen eignet"
  },
  {
    "q": "Was versteht man unter der Kennzahl 'CPA' im Recruiting-Advertising?",
    "options": [
      "Cost per Click (Kosten pro Klick auf das Bild)",
      "Clicks per Ad (Anzahl der Klicks pro Anzeige)",
      "Content per Audience (Inhalte pro Zielgruppe)",
      "Cost per Application (Kosten pro generierter Bewerbung)"
    ],
    "answer": 3,
    "explanation": "CPA steht für Cost per Application (oder Cost per Action) und misst die Kosten pro generierter Bewerbung (Conversion-orientierte Kennzahl)"
  },
  {
    "q": "Welches Abrechnungsmodell ist der Standard bei Recruiting-Kampagnen auf Jobbörsen und Social Media, bei dem nur für den Klick auf die Anzeige gezahlt wird?",
    "options": [
      "CPM (Cost per Mille)",
      "eNPS",
      "CPC (Cost per Click)",
      "Flatrate pro Follower"
    ],
    "answer": 2,
    "explanation": "CPC (Cost per Click) ist das gängige Standardmodell bei Recruiting-Kampagnen, bei dem erst abgerechnet wird, wenn ein Nutzer auf die Anzeige klickt"
  },
  {
    "q": "Wie oft sollte laut Vorlesung auf LinkedIn idealerweise gepostet werden, um vom Algorithmus (360Brew) belohnt zu werden?",
    "options": [
      "5x täglich",
      "Qualität schlägt Frequenz: 3x pro Woche konstant statt sporadischer Peaks.",
      "Genau 1x im Monat.",
      "Nur an Wochenenden."
    ],
    "answer": 1,
    "explanation": "Die Strategie lautet 'Qualität schlägt Frequenz', idealerweise 3x pro Woche konstant posten, da dies besser abschneidet als sporadische Peaks mit langen Pausen"
  },
  {
    "q": "Was ist die 'EVP' im Employer Branding?",
    "options": [
      "Employee Video Platform",
      "External Vendor Partnership",
      "Electronic Verification Process",
      "Employer Value Proposition (Das zentrale Arbeitgeberversprechen / die Arbeitgeberbotschaft)"
    ],
    "answer": 3,
    "explanation": "EVP steht für Employer Value Proposition, also das zentrale Arbeitgeberversprechen (Werte, Kultur, Benefits), das durch den Content gestützt wird"
  },
  {
    "q": "Was ist eine 'Thought Leader Ad' auf LinkedIn?",
    "options": [
      "Ein Werbeformat, bei dem Beiträge einzelner Mitarbeiter (z. B. Experten oder Geschäftsführer) gezielt als Anzeige beworben werden.",
      "Eine Anzeige, die nur auf Wikipedia erscheint.",
      "Eine automatische E-Mail an alle Universitäten.",
      "Ein Format, das nur Bilder ohne Text erlaubt."
    ],
    "answer": 0,
    "explanation": "Thought Leader Ads sind ein Format zur Verstärkung von Beiträgen einzelner Mitarbeiter (z. B. Fachexperten oder CEO) für gezielte Positionierung und Employer Branding"
  },
  {
    "q": "Warum sind klassische Stockfotos in modernen Recruiting-Ads laut Vorlesung problematisch?",
    "options": [
      "Sie verbrauchen zu viel Datenvolumen auf Mobilgeräten.",
      "Sie dürfen aus Datenschutzgründen nicht mehr in der EU verwendet werden.",
      "Sie verlieren an Wirkung, da Authentizität besser funktioniert als Hochglanz. Bewerber*innen reagieren stärker auf echte Gesichter und reale Storys.",
      "Der LinkedIn-Algorithmus blockiert Bilder, die professionell beleuchtet sind."
    ],
    "answer": 2,
    "explanation": "Stockfotos und Hochglanz verlieren an Wirkung, da Authentizität besser funktioniert. Reale Mitarbeitende und echte Situationen ('raw' statt 'glossy') ziehen mehr passende Bewerber an"
  }
];
let currentQuestion=0, score=0, answered=false;
const progressEl=document.getElementById('progress');
const questionEl=document.getElementById('question');
const optionsEl=document.getElementById('options');
const feedbackEl=document.getElementById('feedback');
const nextBtn=document.getElementById('nextBtn');
const quizEl=document.getElementById('quiz');
const resultEl=document.getElementById('result');
const scoreTextEl=document.getElementById('scoreText');
const scoreCircleEl=document.getElementById('scoreCircle');
function loadQuestion(){
  answered=false;
  const q=questions[currentQuestion];
  progressEl.textContent=`Frage ${currentQuestion+1} von ${questions.length}`;
  questionEl.textContent=`${currentQuestion+1}. ${q.q}`;
  optionsEl.innerHTML='';
  feedbackEl.style.display='none';
  feedbackEl.className='feedback';
  nextBtn.style.display='none';
  q.options.forEach((option,index)=>{
    const button=document.createElement('button');
    button.className='option';
    button.textContent=`${String.fromCharCode(65+index)}) ${option}`;
    button.addEventListener('click',()=>selectOption(index,button));
    optionsEl.appendChild(button);
  });
}
function selectOption(index,button){
  if(answered)return;
  answered=true;
  const q=questions[currentQuestion];
  const optionButtons=document.querySelectorAll('.option');
  optionButtons.forEach(btn=>btn.disabled=true);
  optionButtons[q.answer].classList.add('correct');
  if(index===q.answer){
    score++;
    feedbackEl.textContent='Richtig. '+q.explanation;
    feedbackEl.classList.add('success');
  }else{
    button.classList.add('incorrect');
    feedbackEl.textContent='Nicht ganz. '+q.explanation;
    feedbackEl.classList.add('error');
  }
  feedbackEl.style.display='block';
  nextBtn.textContent=currentQuestion<questions.length-1?'Weiter':'Ergebnis anzeigen';
  nextBtn.style.display='inline-block';
}
nextBtn.addEventListener('click',()=>{
  currentQuestion++;
  if(currentQuestion<questions.length){loadQuestion();}else{showResult();}
});
function showResult(){
  quizEl.style.display='none';
  resultEl.style.display='block';
  scoreCircleEl.textContent=score;
  scoreTextEl.textContent=`Du hast ${score} von ${questions.length} Fragen richtig beantwortet.`;
}
function restartQuiz(){
  currentQuestion=0;
  score=0;
  quizEl.style.display='block';
  resultEl.style.display='none';
  loadQuestion();
}
loadQuestion();
</script>
</body>
</html>
