<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Ads Quiz</title>
<style>
:root{--primary-blue:#0b1f38;--secondary-blue:#16365d;--gold:#c8a84e;--light-bg:#f0f4f8;--border-color:#d7e1ec;--text-dark:#0b1f38;--text-muted:#64748b;--correct-bg:#d1fae5;--correct-border:#10b981;--incorrect-bg:#fee2e2;--incorrect-border:#ef4444;--shadow-md:0 12px 30px rgba(11,31,56,.12)}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--light-bg);color:var(--text-dark);min-height:100vh;margin:0}
.quiz-header{background:var(--primary-blue);color:#fff;border-bottom:4px solid var(--gold);padding:1.15rem 1.5rem;box-shadow:0 8px 24px rgba(11,31,56,.13)}
.quiz-header-inner{width:min(1200px,calc(100% - 2rem));margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.quiz-header h1{font-size:clamp(2rem,3.8vw,2.8rem);line-height:1.08;margin:0;font-weight:850;letter-spacing:-.02em;color:#fff;text-align:left}
.back-link-header{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);padding:.82rem 1rem;border-radius:9px;font-weight:800;white-space:nowrap}
.back-link-header:hover{background:rgba(255,255,255,.18)}
.quiz-main{min-height:calc(100vh - 98px);display:flex;justify-content:center;align-items:flex-start;padding:3rem 1.25rem}
.quiz-container{background-color:#fff;border-radius:12px;box-shadow:var(--shadow-md);width:100%;max-width:850px;padding:40px}
.progress{text-align:center;color:var(--text-muted);font-size:15px;margin-bottom:30px;font-weight:700}
.question{font-size:20px;font-weight:750;margin-bottom:25px;line-height:1.5;color:var(--text-dark)}
.options{display:flex;flex-direction:column;gap:12px}.option{background-color:#f8fafc;border:2px solid var(--border-color);border-radius:8px;padding:16px;font-size:16px;cursor:pointer;transition:all .2s ease;text-align:left;font-weight:500;color:#48617d;line-height:1.45}
.option:hover:not(:disabled){background-color:#eef4fa;border-color:#b8c8d8}.option.correct{background-color:var(--correct-bg)!important;border-color:var(--correct-border)!important;color:#065f46!important;font-weight:700}
.option.incorrect{background-color:var(--incorrect-bg)!important;border-color:var(--incorrect-border)!important;color:#991b1b!important}.option:disabled{cursor:default}
.feedback{margin-top:25px;font-size:16px;text-align:left;min-height:24px;padding:15px;border-radius:8px;display:none;line-height:1.5}
.feedback.success{background-color:var(--correct-bg);color:#065f46;border-left:5px solid var(--correct-border)}.feedback.error{background-color:var(--incorrect-bg);color:#991b1b;border-left:5px solid var(--incorrect-border)}
.btn-container{display:flex;justify-content:flex-end;margin-top:30px}.next-btn,.restart-btn{background-color:var(--secondary-blue);color:#fff;border:none;border-radius:8px;padding:14px 28px;font-size:16px;font-weight:800;cursor:pointer;transition:background-color .2s}.next-btn{display:none}.next-btn:hover,.restart-btn:hover{background-color:var(--primary-blue)}
.result-container{text-align:center;display:none}.result-container h2{color:var(--primary-blue);font-size:30px;margin-bottom:20px}.result-container p{font-size:20px;color:#4a5568;margin-bottom:30px}.score-circle{width:150px;height:150px;border-radius:50%;background:var(--primary-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:850;margin:0 auto 24px}
@media(max-width:760px){.quiz-header-inner{width:100%;flex-direction:column;align-items:stretch}.back-link-header{width:100%}.quiz-container{padding:28px 20px}}
</style>
</head>
<body>
<header class="quiz-header"><div class="quiz-header-inner"><h1>TikTok Ads Quiz</h1><a class="back-link-header" href="index.html">← Zurück zur Übersicht</a></div></header>
<main class="quiz-main"><div class="quiz-container">
<div id="quiz"><div class="progress" id="progress"></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><div class="btn-container"><button class="next-btn" id="nextBtn">Weiter</button></div></div>
<div class="result-container" id="result"><div class="score-circle" id="scoreCircle">0</div><h2>Quiz abgeschlossen</h2><p id="scoreText"></p><button class="restart-btn" onclick="restartQuiz()">Nochmal starten</button></div>
</div></main>
<script>
const questions = [{"q": "Welche Aussage beschreibt TikTok im Performance-Marketing am besten?", "options": ["TikTok ist nur ein privates Unterhaltungsnetzwerk ohne Werbemöglichkeiten", "TikTok ist eine Kurzvideo- und Discovery-Plattform mit Potenzial für Reichweite, Engagement und Conversions", "TikTok funktioniert nur über bestehende Follower", "TikTok eignet sich nur für klassische TV-Werbespots"], "answer": 1, "explanation": "TikTok wird als Performance-Kanal genutzt, weil Inhalte durch die For You Page Reichweite, Engagement und messbare Ziele unterstützen können."}, {"q": "Was ist eine zentrale Besonderheit der For You Page?", "options": ["Sie zeigt nur Inhalte von Accounts, denen man bereits folgt", "Sie zeigt Content auch Nutzer*innen, die dem Account nicht folgen", "Sie ist nur für bezahlte Anzeigen sichtbar", "Sie sortiert Videos immer chronologisch"], "answer": 1, "explanation": "Die For You Page kann Inhalte auch an Nicht-Follower ausspielen. Dadurch können auch neue Accounts Reichweite aufbauen."}, {"q": "Welche Nutzergruppe ist laut Vorlesung in Deutschland besonders stark auf TikTok vertreten?", "options": ["16–34 Jahre, mit Wachstum bei 35–49 Jahren", "Ausschließlich Personen über 65 Jahre", "Nur B2B-Entscheider*innen", "Nur Menschen ohne Kaufinteresse"], "answer": 0, "explanation": "Die Vorlesung nennt besonders 16–34 Jahre als starke Gruppe und Wachstum bei 35–49 Jahren."}, {"q": "Was meint „Authentizität statt Perfektion“ auf TikTok?", "options": ["Content soll möglichst spontan, nahbar und nicht zu werblich wirken", "Videos müssen immer wie Hochglanz-TV-Spots aussehen", "Marken sollen gar keine Produkte zeigen", "TikTok bevorzugt ausschließlich statische Bilder"], "answer": 0, "explanation": "TikTok-Content soll glaubwürdig, nahbar und plattformspezifisch wirken. Klassische Hochglanzwerbung wird schneller übersprungen."}, {"q": "Welche Funnel-Stufe steht bei TikTok für Awareness?", "options": ["TOFU", "MOFU", "BOFU", "CPA"], "answer": 0, "explanation": "TOFU bedeutet Top of Funnel. Hier geht es um Aufmerksamkeit, Trends, Hashtags, Challenges und Reichweite."}, {"q": "Welche Inhalte passen besonders gut zu MOFU auf TikTok?", "options": ["Tutorials, How-to-Videos, Storytelling und Community-Engagement", "Nur Impressum und AGB", "Nur statische Banner ohne Ton", "Nur Abrechnungsdaten"], "answer": 0, "explanation": "MOFU baut Interesse und Vertrauen auf. Dafür passen Tutorials, How-to-Videos, Kommentare, Duets, Livestreams und Storytelling."}, {"q": "Was ist in der BOFU-Stufe besonders wichtig?", "options": ["Kauf, Lead, App-Download oder Shop-Besuch auslösen", "Nur Markenbekanntheit ohne Handlung erzeugen", "Alle Kommentare abschalten", "Nur Follower sammeln"], "answer": 0, "explanation": "BOFU steht für Bottom of Funnel. Hier geht es um konkrete Handlungen wie Kauf, Lead, App-Download oder Shop-Besuch."}, {"q": "Welches Signal ist für den TikTok-Algorithmus besonders wichtig?", "options": ["Watch Time und Completion Rate", "Die Farbe des Logos", "Die Anzahl der Mitarbeitenden", "Die Länge des Firmennamens"], "answer": 0, "explanation": "Watch Time und Completion Rate zeigen, ob ein Video fesselt und bis zum Ende angesehen wird."}, {"q": "Was zeigt die Scroll-Stop-Rate beziehungsweise Hook Rate?", "options": ["Wie viele Nutzer*innen in den ersten Sekunden beim Video hängen bleiben", "Wie viele Rechnungen bezahlt wurden", "Wie viele Personen die App installiert haben", "Wie oft ein Produkt im Lager liegt"], "answer": 0, "explanation": "Die ersten Sekunden entscheiden, ob Menschen weiterschauen. Ein starker Hook verbessert die Chance auf weitere Ausspielung."}, {"q": "Welche Faktoren helfen TikTok, den Inhalt eines Videos thematisch einzuordnen?", "options": ["Caption, Sounds, Hashtags und Kontextsignale", "Nur die Bildschirmhelligkeit", "Nur das Tagesbudget", "Nur der Dateiname des Videos"], "answer": 0, "explanation": "Captions, Sounds und Hashtags helfen dem Algorithmus zu verstehen, worum es im Video geht."}, {"q": "Was beschreibt der Interest Graph?", "options": ["TikToks Einordnung von Nutzerinteressen anhand von gesehenen Inhalten, Interaktionen und Suchanfragen", "Eine Liste aller Rechnungen im Ads Manager", "Eine feste Freundesliste wie bei klassischen sozialen Netzwerken", "Ein AR-Filter für Marken"], "answer": 0, "explanation": "TikTok ordnet Nutzer*innen in Content-Cluster ein, zum Beispiel Fitness, Beauty, DIY, Comedy oder Finanz-Tipps."}, {"q": "Welche Herausforderung ist typisch für TikTok-Trends?", "options": ["Trends können innerhalb weniger Tage oder sogar Stunden verschwinden", "Trends bleiben immer mehrere Jahre gleich", "Trends haben keinen Einfluss auf Reichweite", "Trends dürfen nicht in Videos genutzt werden"], "answer": 0, "explanation": "TikTok hat schnelle Trendzyklen. Marken brauchen daher flexible Prozesse und schnelle Content-Produktion."}, {"q": "Was ist ein Risiko, wenn TikTok-Content zu werblich wirkt?", "options": ["Nutzer*innen scrollen weg, der Content wirkt unglaubwürdig und kann negative Kommentare auslösen", "Das Video wird automatisch länger", "Der TikTok Pixel installiert sich von allein", "Das Budget wird kostenlos"], "answer": 0, "explanation": "TikTok-User*innen haben wenig Toleranz für klassische Werbung. Ads müssen nativ und authentisch wirken."}, {"q": "Welche Werbeformate sind besonders relevant für Performance-Ziele wie Leads, Conversions oder Shop-Abverkäufe?", "options": ["In-Feed Ads und Spark Ads", "Nur TopView Ads", "Nur Branded Effects", "Nur organische Posts ohne CTA"], "answer": 0, "explanation": "Für Performance-Ziele liegt der Fokus besonders auf In-Feed Ads und Spark Ads."}, {"q": "Was sind In-Feed Ads?", "options": ["Native Videoanzeigen im „Für dich“-Feed mit Targeting und CTA", "Nur Kommentare unter organischen Posts", "Statische Anzeigen ausschließlich beim App-Start", "Ein reines AR-Format ohne Klickmöglichkeit"], "answer": 0, "explanation": "In-Feed Ads erscheinen zwischen organischen Videos im For You Feed und können mit CTA, Targeting und Conversion-Zielen genutzt werden."}, {"q": "Was ist der Vorteil von Spark Ads?", "options": ["Organische Posts werden als Anzeige verstärkt und Social Proof wie Likes, Kommentare und Shares bleibt sichtbar", "Sie blenden grundsätzlich alle Kommentare aus", "Sie funktionieren nur ohne Creator-Content", "Sie sind ausschließlich für Offline-Werbung gedacht"], "answer": 0, "explanation": "Spark Ads verbinden organischen Social Proof mit bezahlter Reichweite und wirken dadurch oft authentischer."}, {"q": "Wofür eignen sich TopView Ads laut Vorlesung eher?", "options": ["Awareness und hohe Sichtbarkeit", "Nur Remarketing im Warenkorb", "Ausschließlich Lead-Formulare", "Nur organische Kommentare"], "answer": 0, "explanation": "TopView Ads sind sehr sichtbar, aber teuer und eher Awareness-orientiert als klassisch performancegetrieben."}, {"q": "Was ermöglichen Custom Audiences im TikTok Ads Manager?", "options": ["Bekannte Nutzergruppen wie Website-Besucher, App-Nutzer, Video Viewer oder Kundenlisten gezielt anzusprechen", "Alle Nutzer*innen ohne Datenschutzgrundlage automatisch zu speichern", "Nur neue Hashtags zu erstellen", "TopView Ads kostenlos auszuspielen"], "answer": 0, "explanation": "Custom Audiences ermöglichen gezielte Ansprache bekannter Nutzergruppen, zum Beispiel über TikTok Pixel, App-Daten, Video Viewer oder Kundenlisten."}, {"q": "Welche Aussage zu Predictive Analytics im TikTok-Marketing passt am besten?", "options": ["KI prognostiziert, welche Creatives oder Inhalte wahrscheinlich gut performen oder viral gehen", "Predictive Analytics ersetzt jedes Creative", "Predictive Analytics bedeutet, dass keine Daten mehr gebraucht werden", "Es ist nur ein Filter für Selfies"], "answer": 0, "explanation": "Predictive Analytics bedeutet, dass KI anhand von Daten Prognosen zu Engagement, Viralität oder Performance ableitet."}, {"q": "Welche KPIs passen besonders zu BOFU-Kampagnen auf TikTok?", "options": ["Conversions, CPA, Conversion Rate und ROAS", "Nur Musiklautstärke und Videofarbe", "Nur Anzahl der Hashtags", "Nur Profilbild-Aufrufe"], "answer": 0, "explanation": "Bei BOFU geht es um messbare Handlungen. Deshalb sind Conversions, CPA, Conversion Rate und ROAS besonders wichtig."}];
let currentQuestion=0, score=0, answered=false;
const progressEl=document.getElementById('progress'), questionEl=document.getElementById('question'), optionsEl=document.getElementById('options'), feedbackEl=document.getElementById('feedback'), nextBtn=document.getElementById('nextBtn'), quizEl=document.getElementById('quiz'), resultEl=document.getElementById('result'), scoreTextEl=document.getElementById('scoreText'), scoreCircleEl=document.getElementById('scoreCircle');
function loadQuestion(){answered=false;const q=questions[currentQuestion];progressEl.textContent=`Frage ${currentQuestion+1} von ${questions.length}`;questionEl.textContent=`${currentQuestion+1}. ${q.q}`;optionsEl.innerHTML='';feedbackEl.style.display='none';feedbackEl.className='feedback';nextBtn.style.display='none';q.options.forEach((option,index)=>{const button=document.createElement('button');button.className='option';button.textContent=`${String.fromCharCode(65+index)}) ${option}`;button.addEventListener('click',()=>selectOption(index,button));optionsEl.appendChild(button);});}
function selectOption(index,button){if(answered)return;answered=true;const q=questions[currentQuestion];const optionButtons=document.querySelectorAll('.option');optionButtons.forEach(btn=>btn.disabled=true);if(index===q.answer){score++;button.classList.add('correct');feedbackEl.textContent='Richtig. '+q.explanation;feedbackEl.classList.add('success');}else{button.classList.add('incorrect');optionButtons[q.answer].classList.add('correct');feedbackEl.textContent='Nicht ganz. '+q.explanation;feedbackEl.classList.add('error');}feedbackEl.style.display='block';nextBtn.style.display='inline-block';}
nextBtn.addEventListener('click',()=>{currentQuestion++;if(currentQuestion<questions.length){loadQuestion();}else{showResult();}});
function showResult(){quizEl.style.display='none';resultEl.style.display='block';scoreCircleEl.textContent=score;scoreTextEl.textContent=`Du hast ${score} von ${questions.length} Fragen richtig beantwortet.`;}
function restartQuiz(){currentQuestion=0;score=0;quizEl.style.display='block';resultEl.style.display='none';loadQuestion();}
loadQuestion();
</script>
</body></html>
